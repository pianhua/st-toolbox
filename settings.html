<div class="st-toolbox-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b><i class="fa-solid fa-toolbox"></i> ST Toolbox (Pi 极简工具箱)</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div class="st-toolbox-container">
                <!-- Section 1: Allowed Paths -->
                <div class="st-toolbox-section">
                    <div class="st-toolbox-section-title">
                        <span><i class="fa-solid fa-folder-tree"></i> 白名单目录配置</span>
                        <small>SillyTavern 根目录默认可访问。每行输入一个允许 AI 操作的目录路径（支持 ~ 用户主目录）。</small>
                    </div>

                    <div class="st-toolbox-quick-bar">
                        <span>快捷添加：</span>
                        <button class="menu_button menu_button_icon st-toolbox-quick-add" data-path="~/Desktop">
                            <i class="fa-solid fa-desktop"></i> 桌面 (~/Desktop)
                        </button>
                        <button class="menu_button menu_button_icon st-toolbox-quick-add" data-path="~/Documents">
                            <i class="fa-solid fa-folder-open"></i> 文档 (~/Documents)
                        </button>
                        <button class="menu_button menu_button_icon st-toolbox-quick-add" data-path="~/Downloads">
                            <i class="fa-solid fa-download"></i> 下载 (~/Downloads)
                        </button>
                    </div>

                    <textarea 
                        id="st-toolbox-allowed-paths" 
                        class="text_pole textarea_compact st-toolbox-textarea" 
                        rows="4" 
                        placeholder="C:\Users\Username\Desktop&#10;D:\Projects&#10;~/Documents"
                    ></textarea>

                    <div class="st-toolbox-test-bar">
                        <input id="st-toolbox-test-input" type="text" class="text_pole" placeholder="输入路径测试是否在白名单中..." />
                        <button id="st-toolbox-test-path-btn" class="menu_button">
                            <i class="fa-solid fa-magnifying-glass"></i> 测试路径
                        </button>
                    </div>
                    <div id="st-toolbox-test-result" class="st-toolbox-test-result"></div>
                </div>

                <!-- Section 2: 4 Pi Core Tools -->
                <div class="st-toolbox-section" style="margin-top: 12px;">
                    <div class="st-toolbox-section-title">
                        <span><i class="fa-solid fa-cube"></i> Pi 极简 4 大核心工具权限</span>
                        <small>极简设计，大幅节省 Prompt 上下文 Token，杜绝 LLM 工具选择混淆。</small>
                    </div>

                    <div class="st-toolbox-grid">
                        <div class="st-toolbox-tool-card">
                            <label><input type="checkbox" class="st-toolbox-tool-toggle" data-tool="read_file" checked /> <b>read_file (读)</b></label>
                            <small>读取指定文件内容，支持分块与行号</small>
                        </div>
                        <div class="st-toolbox-tool-card">
                            <label><input type="checkbox" class="st-toolbox-tool-toggle" data-tool="write_file" checked /> <b>write_file (写)</b></label>
                            <small>原子写入/创建文件，自动备份</small>
                        </div>
                        <div class="st-toolbox-tool-card">
                            <label><input type="checkbox" class="st-toolbox-tool-toggle" data-tool="edit_file" checked /> <b>edit_file (改)</b></label>
                            <small>智能模糊容错代码精准替换</small>
                        </div>
                        <div class="st-toolbox-tool-card">
                            <label><input type="checkbox" class="st-toolbox-tool-toggle" data-tool="execute_bash" checked /> <b>execute_bash (执行)</b></label>
                            <small>PowerShell/Bash 命令行与检索执行</small>
                        </div>
                    </div>
                </div>

                <!-- Section 3: Logs -->
                <div class="st-toolbox-section" style="margin-top: 12px;">
                    <div class="st-toolbox-section-title">
                        <span><i class="fa-solid fa-list-check"></i> 实时调用记录</span>
                        <button id="st-toolbox-clear-logs" class="menu_button menu_button_icon" style="float:right;">
                            <i class="fa-solid fa-broom"></i> 清空
                        </button>
                    </div>
                    <div id="st-toolbox-logs-list" class="st-toolbox-logs-list"></div>
                </div>

                <!-- Action Buttons -->
                <div class="st-toolbox-actions">
                    <button id="st-toolbox-save" class="menu_button menu_button_primary">
                        <i class="fa-solid fa-floppy-disk"></i> 保存配置
                    </button>
                    <button id="st-toolbox-reload" class="menu_button">
                        <i class="fa-solid fa-rotate"></i> 重新加载
                    </button>
                </div>

                <div id="st-toolbox-status" class="st-toolbox-status"></div>
            </div>
        </div>
    </div>
</div>
